name: CI - La Chaise du Savoir

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────
  # JOB 1 : Tests
  # ──────────────────────────────────────────
  test:
    name: Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compiler et lancer les tests
        run: mvn clean verify

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # ──────────────────────────────────────────
  # JOB 2 : Déploiement (seulement sur main)
  # ──────────────────────────────────────────
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: test                  # attend que les tests passent
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build du JAR de production
        run: mvn clean package -DskipTests

      - name: Uploader l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
